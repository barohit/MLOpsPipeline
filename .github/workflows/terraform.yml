# Plan on pull requests (read-only role), apply on merge to main (deploy role,
# behind the "production" environment so it can require an approval).
#
# Repository variables to set (Settings > Variables, not secrets):
#   AWS_REGION, AWS_PLAN_ROLE_ARN, AWS_DEPLOY_ROLE_ARN,
#   TF_STATE_BUCKET, TF_LOCK_TABLE, plus TF_VAR_* values from terraform.tfvars.example
name: terraform

on:
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infra/terraform/envs/dev
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_artifacts_bucket_name: ${{ vars.ARTIFACTS_BUCKET }}
  TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_lock_table_name: ${{ vars.TF_LOCK_TABLE }}
  TF_VAR_github_repository: ${{ github.repository }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: init
        run: >
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: plan
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          { echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency: terraform-dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: init
        run: >
          terraform -chdir="$TF_DIR" init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve -lock-timeout=5m
