# Before a blue-green cutover: call the green (preview) version directly with a
# known request and check it answers with a prediction and reports which model
# version it is serving. Runs as a one-off Job inside the cluster.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: smoke-test
spec:
  args:
    - name: service
  metrics:
    - name: smoke-test
      count: 1
      failureLimit: 0
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 120
            template:
              spec:
                restartPolicy: Never
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 10001
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: smoke-test
                    image: curlimages/curl:8.10.1
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        set -e
                        base="http://{{args.service}}.mlops.svc.cluster.local"
                        curl -sf "$base/ready"
                        body=$(curl -sf -X POST "$base/predict" \
                          -H 'Content-Type: application/json' \
                          -H 'X-Request-ID: smoke-test' \
                          -d '{"team_points_per_minute":1.6,"team_two_point_percentage":0.52,"team_three_point_percentage":0.36,"team_free_throw_percentage":0.74,"team_assist_turnover_ratio":1.3,"team_non_offensive_foul_turnovers":40,"team_total_rebounds":420,"team_offensive_rebound_ratio":0.28,"team_steals_per_minute":0.08,"team_blocks_per_minute":0.04,"team_three_point_attempt_rate":0.38,"player_count":5,"avg_height_inches":77,"upperclassman_ratio":0.6,"experience_score":3.1,"team_high_impact_player_count":1}')
                        echo "$body"
                        echo "$body" | grep -q '"predicted_regular_season_wins"'
                        echo "$body" | grep -q '"model_version"'
