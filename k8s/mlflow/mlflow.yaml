# MLflow tracking server and model registry for the dev cluster.
#
# Artifacts live in S3 and are proxied by the server (--serve-artifacts), so only
# this pod has S3 access; inference pods and CI just talk to the server.
#
# Dev shortcut: registry metadata is SQLite on a persistent volume, one replica.
# For production, use a managed Postgres (RDS) as --backend-store-uri and run more
# than one replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-db
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  # SQLite allows one writer; never run two pods against the same file
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      serviceAccountName: mlflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: mlops-mlflow
          command: ["mlflow", "server"]
          args:
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --artifacts-destination=s3://$(ARTIFACTS_BUCKET)/mlflow
            - --serve-artifacts
          env:
            - name: ARTIFACTS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: ARTIFACTS_BUCKET
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db
              mountPath: /mlflow
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: mlflow-db
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
