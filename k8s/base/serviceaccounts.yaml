# One service account per workload, each mapped to its own IAM role (IRSA).
# Paste the role ARNs from `terraform output`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
# No IAM role: the inference pods fetch models through the MLflow server and never
# touch AWS directly. They also don't need the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_mlflow_role_arn
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift-checker
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_drift_checker_role_arn
