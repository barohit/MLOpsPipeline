apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - pod-monitor.yaml
  - prometheus-rules.yaml

# Grafana's sidecar loads any ConfigMap labeled grafana_dashboard=1
configMapGenerator:
  - name: inference-dashboard
    files:
      - inference-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
